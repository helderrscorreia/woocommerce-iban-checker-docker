name: Bug report
description: Report a false negative, false positive, crash, or unexpected behavior
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include real IBANs, customer data, database credentials, or SMTP
        passwords. Report security vulnerabilities privately via SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the relevant `.env` values with secrets replaced by placeholders.
      placeholder: |
        1. Configure ...
        2. Change the option to ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `docker compose logs` with credentials and bank details redacted.
      render: text
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Auto-restore
      options:
        - Disabled (alert only)
        - Enabled
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Docker version, host OS, MySQL/MariaDB version, WordPress/WooCommerce version, object cache if any.
    validations:
      required: true
